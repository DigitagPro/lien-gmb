<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digitag NFC Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center pt-6 px-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 mb-6 text-center border-b-4 border-blue-600">
        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">DIGITAG PRO</h1>
        <p class="text-slate-500 text-xs mt-1 uppercase tracking-widest">NFC Link Generator</p>
    </div>

    <div id="setupBox" class="hidden w-full max-w-md bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="font-bold text-slate-800 mb-2">🔑 Configuration</h2>
        <p class="text-slate-500 text-sm mb-4">Entrez votre nouvelle clé SerpApi :</p>
        <input type="password" id="apiKeyInput" class="w-full p-3 border rounded-xl mb-3 bg-slate-50" placeholder="Coller la clé ici...">
        <button onclick="saveApiKey()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Activer l'outil</button>
    </div>

    <div id="mainInterface" class="w-full max-w-md space-y-4">
        <div class="bg-white rounded-2xl shadow-lg p-6" id="searchBox">
            <div class="space-y-4">
                <input type="text" id="nom" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 px-4" placeholder="Nom de l'entreprise">
                <input type="text" id="ville" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 px-4" placeholder="Ville">
                <button onclick="lancerRecherche()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">
                    RECHERCHER
                </button>
            </div>
            
            <div id="loading" class="hidden mt-6 text-center">
                <div class="spinner mb-2"></div>
                <p class="text-xs text-slate-400">Connexion à Google via Proxy...</p>
            </div>

            <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-100">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> <span id="errorText">Erreur</span>
                <button onclick="resetKey()" class="block mt-2 underline font-bold text-red-700">Changer la clé API</button>
            </div>
        </div>

        <div id="choices" class="space-y-3"></div>
    </div>

    <div id="finalResult" class="hidden w-full max-w-md bg-white rounded-2xl shadow-2xl p-0 border-2 border-green-500 overflow-hidden">
        <div class="bg-green-500 text-white text-[10px] font-bold py-2 text-center tracking-widest uppercase">Prêt pour la plaque NFC</div>
        <div class="p-6 text-center">
            <h3 class="text-xl font-bold text-slate-800 mb-1" id="nomFinal"></h3>
            <p class="text-xs text-slate-400 mb-6" id="adresseFinal"></p>
            
            <button onclick="copierLien()" id="btnCopy" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 mb-4">
                <i class="fa-regular fa-copy"></i> <span id="btnCopyText">COPIER LE LIEN</span>
            </button>
            
            <button onclick="location.reload()" class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Nouvelle recherche</button>
        </div>
    </div>

    <script>
        // --- LOGIQUE CLÉ ---
        function checkKey() {
            const key = localStorage.getItem('serpapi_key');
            if (!key) {
                document.getElementById('setupBox').classList.remove('hidden');
                document.getElementById('mainInterface').classList.add('hidden');
            }
        }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                localStorage.setItem('serpapi_key', val);
                location.reload();
            }
        }

        function resetKey() {
            localStorage.removeItem('serpapi_key');
            location.reload();
        }

        // --- RECHERCHE ---
        async function lancerRecherche() {
            const API_KEY = localStorage.getItem('serpapi_key');
            const nom = document.getElementById('nom').value.trim();
            const ville = document.getElementById('ville').value.trim();
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMessage');
            const choicesDiv = document.getElementById('choices');

            if (!nom) return;

            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            choicesDiv.innerHTML = "";

            // Proxy robuste AllOrigins
            const query = encodeURIComponent(nom + " " + ville);
            const targetUrl = `https://serpapi.com/search.json?engine=google_maps&q=${query}&api_key=${API_KEY}&type=search`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&timestamp=${new Date().getTime()}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Erreur réseau (Proxy)");
                
                const rawData = await response.json();
                
                // Vérifier si le contenu existe
                if (!rawData.contents) throw new Error("Réponse vide du serveur");
                
                const data = JSON.parse(rawData.contents);

                if (data.error) {
                    if (data.error.includes("API key")) throw new Error("Clé API invalide ou expirée.");
                    throw new Error(data.error);
                }

                let results = data.local_results || (data.place_results ? [data.place_results] : []);

                if (results.length === 0) throw new Error("Aucun établissement trouvé sur Maps.");

                loading.classList.add('hidden');

                if (results.length === 1) {
                    showFinal(results);
                } else {
                    results.forEach(place => {
                        const d = document.createElement('div');
                        d.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center cursor-pointer active:bg-blue-50";
                        d.onclick = () => showFinal(place);
                        d.innerHTML = `<div><div class="font-bold text-slate-700">${place.title}</div><div class="text-[10px] text-slate-400">${place.address || ""}</div></div><i class="fa-solid fa-chevron-right text-blue-500"></i>`;
                        choicesDiv.appendChild(d);
                    });
                }

            } catch (err) {
                loading.classList.add('hidden');
                document.getElementById('errorText').innerText = err.message;
                errorMsg.classList.remove('hidden');
                console.error(err);
            }
        }

        function showFinal(place) {
            document.getElementById('mainInterface').classList.add('hidden');
            document.getElementById('finalResult').classList.remove('hidden');
            document.getElementById('nomFinal').innerText = place.title;
            document.getElementById('adresseFinal').innerText = place.address || "";
            window.currentLien = `https://search.google.com/local/writereview?placeid=${place.place_id}`;
        }

        function copierLien() {
            navigator.clipboard.writeText(window.currentLien).then(() => {
                const btn = document.getElementById('btnCopy');
                btn.classList.replace('bg-slate-900', 'bg-green-500');
                document.getElementById('btnCopyText').innerText = "LIEN COPIÉ !";
                if (navigator.vibrate) navigator.vibrate(50);
                setTimeout(() => {
                    btn.classList.replace('bg-green-500', 'bg-slate-900');
                    document.getElementById('btnCopyText').innerText = "COPIER LE LIEN";
                }, 2000);
            });
        }

        checkKey();
    </script>
</body>
</html>
