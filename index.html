<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digitag Pro - Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center pt-6 px-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 mb-6 text-center border-b-4 border-blue-600">
        <h1 class="text-2xl font-bold text-slate-800">DIGITAG PRO</h1>
        <p class="text-slate-500 text-xs mt-1 uppercase">Générateur NFC</p>
    </div>

    <div id="setupBox" class="hidden w-full max-w-md bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="font-bold mb-2">🔑 Configuration</h2>
        <input type="password" id="apiKeyInput" class="w-full p-3 border rounded-xl mb-3 bg-slate-50" placeholder="Coller la clé SerpApi ici...">
        <button onclick="saveApiKey()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Enregistrer la clé</button>
    </div>

    <div id="mainInterface" class="w-full max-w-md space-y-4">
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <input type="text" id="nom" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 px-4 mb-4" placeholder="Nom de l'entreprise">
            <input type="text" id="ville" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 px-4 mb-4" placeholder="Ville">
            <button onclick="lancerRecherche()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">RECHERCHER</button>
            
            <div id="loading" class="hidden mt-6 text-center italic text-slate-400 text-sm">Recherche en cours...</div>

            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200">
                <p class="font-bold mb-1">Détail de l'erreur :</p>
                <div id="errorText" class="font-mono mb-3"></div>
                <button onclick="resetKey()" class="text-blue-600 underline font-bold">Réinitialiser la clé API</button>
            </div>
        </div>
        <div id="choices" class="space-y-3"></div>
    </div>

    <div id="finalResult" class="hidden w-full max-w-md bg-white rounded-2xl shadow-2xl border-2 border-green-500 overflow-hidden">
        <div class="p-6 text-center">
            <h3 class="text-xl font-bold mb-1" id="nomFinal"></h3>
            <p class="text-xs text-slate-400 mb-6" id="adresseFinal"></p>
            <button onclick="copierLien()" id="btnCopy" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-xl mb-4">COPIER LE LIEN</button>
            <button onclick="location.reload()" class="text-slate-300 text-[10px] uppercase font-bold tracking-widest">Retour</button>
        </div>
    </div>

    <script>
        function checkKey() {
            const key = localStorage.getItem('serpapi_key');
            if (!key) {
                document.getElementById('setupBox').classList.remove('hidden');
                document.getElementById('mainInterface').classList.add('hidden');
            }
        }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) { localStorage.setItem('serpapi_key', val); location.reload(); }
        }

        function resetKey() { localStorage.removeItem('serpapi_key'); location.reload(); }

        async function lancerRecherche() {
            const API_KEY = localStorage.getItem('serpapi_key');
            const nom = document.getElementById('nom').value.trim();
            const ville = document.getElementById('ville').value.trim();
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const choicesDiv = document.getElementById('choices');

            if (!nom) return;
            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            choicesDiv.innerHTML = "";

            // Utilisation d'un proxy plus simple pour tester
            const targetUrl = `https://serpapi.com/search.json?engine=google_maps&q=${encodeURIComponent(nom + " " + ville)}&api_key=${API_KEY}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Le serveur proxy ne répond pas.");
                
                const rawData = await response.json();
                if (!rawData.contents) throw new Error("Le proxy a renvoyé une réponse vide.");
                
                const data = JSON.parse(rawData.contents);

                if (data.error) throw new Error("SerpApi dit : " + data.error);

                let results = data.local_results || (data.place_results ? [data.place_results] : []);
                if (results.length === 0) throw new Error("Google n'a trouvé aucun établissement.");

                loading.classList.add('hidden');
                if (results.length === 1) { showFinal(results); } 
                else {
                    results.forEach(place => {
                        const d = document.createElement('div');
                        d.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center cursor-pointer";
                        d.onclick = () => showFinal(place);
                        d.innerHTML = `<div><div class="font-bold text-slate-700">${place.title}</div><div class="text-[10px] text-slate-400">${place.address || ""}</div></div><i class="fa-solid fa-chevron-right text-blue-500"></i>`;
                        choicesDiv.appendChild(d);
                    });
                }
            } catch (err) {
                loading.classList.add('hidden');
                errorText.innerText = err.message;
                errorMsg.classList.remove('hidden');
            }
        }

        function showFinal(place) {
            document.getElementById('mainInterface').classList.add('hidden');
            document.getElementById('finalResult').classList.remove('hidden');
            document.getElementById('nomFinal').innerText = place.title;
            document.getElementById('adresseFinal').innerText = place.address || "";
            window.currentLien = `https://search.google.com/local/writereview?placeid=${place.place_id}`;
        }

        function copierLien() {
            navigator.clipboard.writeText(window.currentLien).then(() => {
                const btn = document.getElementById('btnCopy');
                btn.classList.replace('bg-slate-900', 'bg-green-500');
                btn.innerText = "LIEN COPIÉ !";
                setTimeout(() => { btn.classList.replace('bg-green-500', 'bg-slate-900'); btn.innerText = "COPIER LE LIEN"; }, 2000);
            });
        }
        checkKey();
    </script>
</body>
</html>
