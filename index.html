<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitag NFC Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center pt-6 px-4 font-sans text-slate-900">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 mb-6 text-center border-b-4 border-blue-600">
        <h1 class="text-2xl font-black italic tracking-tighter text-blue-600 uppercase">Digitag Pro</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">NFC Tool - Mobile Optimized</p>
    </div>

    <div id="ui-search" class="w-full max-w-md space-y-4">
        <form id="form" class="bg-white rounded-2xl shadow-lg p-6">
            <div class="space-y-3">
                <input type="text" id="nom" class="w-full bg-slate-100 border-none rounded-xl py-4 px-4 font-semibold outline-none" placeholder="Nom de l'entreprise..." required>
                <input type="text" id="ville" class="w-full bg-slate-100 border-none rounded-xl py-4 px-4 font-semibold outline-none" placeholder="Ville">
                <button type="submit" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all uppercase tracking-wide">
                    Trouver le lien
                </button>
            </div>
            <div id="loader" class="hidden mt-6 text-center">
                <div class="spinner mb-2"></div>
                <p class="text-xs text-slate-400 font-bold">Recherche en cours...</p>
            </div>
            <div id="error" class="hidden mt-4 p-4 bg-red-50 text-red-600 text-xs rounded-xl font-bold border border-red-100"></div>
        </form>
        <div id="results" class="space-y-2"></div>
    </div>

    <div id="ui-final" class="hidden w-full max-w-md bg-white rounded-3xl shadow-2xl border-2 border-green-500 overflow-hidden">
        <div class="bg-green-500 py-2 text-center text-white text-[10px] font-black uppercase tracking-widest">Lien généré avec succès</div>
        <div class="p-8 text-center">
            <h2 id="final-name" class="text-2xl font-black text-slate-800 mb-1"></h2>
            <p id="final-addr" class="text-xs text-slate-400 mb-8"></p>

            <input type="text" id="url-stock" class="sr-only" readonly>

            <div class="space-y-3">
                <a id="open-btn" href="#" target="_blank" rel="noopener" class="w-full bg-blue-50 text-blue-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-3 border border-blue-200 active:scale-95 transition-all uppercase text-sm">
                    <i class="fa-solid fa-eye"></i> Vérifier la fiche
                </a>
                <button type="button" id="copy-btn" class="w-full bg-slate-900 text-white font-black py-6 rounded-2xl shadow-xl flex items-center justify-center gap-3 active:scale-90 transition-all">
                    <i class="fa-regular fa-copy text-2xl"></i>
                    <span id="copy-text" class="text-lg uppercase">Copier pour NFC</span>
                </button>
            </div>

            <button type="button" onclick="location.reload()" class="mt-8 text-slate-300 font-bold text-[10px] uppercase underline">Nouvelle recherche</button>
        </div>
    </div>

    <p class="text-[8px] text-slate-300 mt-8 uppercase font-bold tracking-widest">Version 7.0 - Simple</p>

    <script>
        const $ = (id) => document.getElementById(id);

        const MY_KEY = "328e85de5f06a1f5f24666e8367a7614c81522d7d0b561bd0b42851a90e8c451";

        // Plusieurs proxys CORS : si l'un est en panne, on essaie le suivant
        const PROXIES = [
            (u) => u, // appel direct d'abord (si SerpAPI autorise le CORS)
            (u) => 'https://corsproxy.io/?' + encodeURIComponent(u),
            (u) => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
            (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
        ];

        async function fetchSerp(q) {
            const api = 'https://serpapi.com/search.json?engine=google_maps&type=search&hl=fr&q=' + encodeURIComponent(q) + '&api_key=' + MY_KEY;
            const errs = [];
            for (const p of PROXIES) {
                try {
                    const r = await fetch(p(api));
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const data = await r.json();
                    if (data.error) {
                        // Erreur renvoyée par SerpAPI lui-même (clé, quota, aucun résultat) : inutile de changer de proxy
                        const err = new Error(data.error); err.final = true; throw err;
                    }
                    return data;
                } catch (e) {
                    if (e.final) throw e;
                    errs.push(e.message);
                }
            }
            throw new Error('Connexion impossible (' + errs.join(' / ') + ')');
        }

        $('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nom = $('nom').value.trim();
            const ville = $('ville').value.trim();
            if (!nom) return;

            $('loader').classList.remove('hidden');
            $('error').classList.add('hidden');
            $('results').innerHTML = '';

            try {
                const data = await fetchSerp((nom + ' ' + ville).trim());
                const raw = data.local_results || (data.place_results ? [data.place_results] : []);
                const results = raw.filter(p => p.place_id).map(p => ({ title: p.title, address: p.address || '', place_id: p.place_id }));
                if (!results.length) throw new Error('Aucun établissement trouvé.');

                results.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-xl shadow-md border border-slate-100 flex justify-between items-center cursor-pointer';
                    card.onclick = () => showSuccess(item);

                    const left = document.createElement('div');
                    const t = document.createElement('div');
                    t.className = 'font-bold text-slate-800 text-left text-sm';
                    t.textContent = item.title;
                    const a = document.createElement('div');
                    a.className = 'text-[10px] text-slate-400 text-left';
                    a.textContent = item.address;
                    left.append(t, a);

                    const icon = document.createElement('i');
                    icon.className = 'fa-solid fa-chevron-right text-blue-600';
                    card.append(left, icon);
                    $('results').appendChild(card);
                });
            } catch (err) {
                $('error').textContent = 'ERREUR : ' + err.message;
                $('error').classList.remove('hidden');
            } finally {
                $('loader').classList.add('hidden');
            }
        });

        function showSuccess(place) {
            const url = 'https://search.google.com/local/writereview?placeid=' + place.place_id;
            $('ui-search').classList.add('hidden');
            $('ui-final').classList.remove('hidden');
            $('final-name').textContent = place.title;
            $('final-addr').textContent = place.address;
            $('url-stock').value = url;
            $('open-btn').href = url;
        }

        $('copy-btn').addEventListener('click', async () => {
            const input = $('url-stock');
            try {
                await navigator.clipboard.writeText(input.value);
            } catch (_) {
                input.select();
                input.setSelectionRange(0, 99999);
                document.execCommand('copy');
            }
            const btn = $('copy-btn'), txt = $('copy-text');
            btn.classList.replace('bg-slate-900', 'bg-green-500');
            txt.textContent = 'COPIÉ !';
            if (navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => {
                btn.classList.replace('bg-green-500', 'bg-slate-900');
                txt.textContent = 'COPIER POUR NFC';
            }, 2000);
        });
    </script>
</body>
</html>
