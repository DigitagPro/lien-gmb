<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digitag NFC - V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center pt-6 px-4 font-sans text-slate-900">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 mb-6 text-center border-b-4 border-orange-500">
        <h1 class="text-2xl font-black italic tracking-tighter text-blue-700">DIGITAG <span class="text-orange-500">PRO</span></h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Version 5 - Tunnel Secours</p>
    </div>

    <div id="ui-search" class="w-full max-w-md space-y-4">
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <div class="space-y-3">
                <input type="text" id="nom" class="w-full bg-slate-100 border-none rounded-xl py-4 px-4 font-semibold" placeholder="Nom de l'entreprise...">
                <input type="text" id="ville" class="w-full bg-slate-100 border-none rounded-xl py-4 px-4 font-semibold" placeholder="Ville (ex: Lyon)">
                <button onclick="chercher()" class="w-full bg-orange-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-all uppercase">
                    Lancer la recherche
                </button>
            </div>
            <div id="loader" class="hidden mt-6 text-center">
                <div class="spinner mb-2"></div>
                <p class="text-xs text-slate-400 font-bold">Tentative de connexion au tunnel...</p>
            </div>
            <div id="error" class="hidden mt-4 p-4 bg-red-50 text-red-600 text-[10px] rounded-xl font-bold border border-red-100"></div>
        </div>
        <div id="results" class="space-y-2"></div>
    </div>

    <div id="ui-final" class="hidden w-full max-w-md bg-white rounded-3xl shadow-2xl border-2 border-green-500 overflow-hidden">
        <div class="bg-green-500 py-2 text-center text-white text-[10px] font-black uppercase tracking-widest">Lien prêt pour NFC</div>
        <div class="p-8 text-center">
            <h2 id="final-name" class="text-2xl font-black text-slate-800 mb-2"></h2>
            <p id="final-addr" class="text-sm text-slate-400 mb-8"></p>
            <button onclick="copy()" id="copy-btn" class="w-full bg-slate-900 text-white font-black py-6 rounded-2xl shadow-2xl flex items-center justify-center gap-3">
                <i class="fa-regular fa-copy text-2xl"></i>
                <span id="copy-text" class="text-lg">Copier le lien</span>
            </button>
            <button onclick="location.reload()" class="mt-8 text-slate-300 font-bold text-[10px] uppercase underline">Nouvelle recherche</button>
        </div>
    </div>

    <script>
        const MY_KEY = "328e85de5f06a1f5f24666e8367a7614c81522d7d0b561bd0b42851a90e8c451";

        async function chercher() {
            const nom = document.getElementById('nom').value;
            const ville = document.getElementById('ville').value;
            const loader = document.getElementById('loader');
            const error = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            if(!nom) return;
            
            loader.classList.remove('hidden');
            error.classList.add('hidden');
            resultsDiv.innerHTML = "";

            const query = encodeURIComponent(nom + " " + ville);
            const api = `https://serpapi.com/search.json?engine=google_maps&q=${query}&api_key=${MY_KEY}`;
            
            // --- ON UTILISE COD TABS (Nouveau Tunnel plus rapide) ---
            const proxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(api)}`;

            try {
                const resp = await fetch(proxy);
                if (!resp.ok) throw new Error("Le tunnel de secours est saturé. Réessaie.");
                
                const data = await resp.json();

                if(data.error) throw new Error("SerpApi: " + data.error);

                const items = data.local_results || (data.place_results ? [data.place_results] : []);
                
                if(items.length === 0) throw new Error("Google n'a rien trouvé. Précise le nom.");

                loader.classList.add('hidden');

                if(items.length === 1) {
                    showSuccess(items);
                } else {
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-white p-4 rounded-xl shadow-md border border-slate-100 flex justify-between items-center cursor-pointer active:bg-orange-50";
                        card.onclick = () => showSuccess(item);
                        card.innerHTML = `<div><div class="font-bold text-slate-800">${item.title}</div><div class="text-[10px] text-slate-400">${item.address || ''}</div></div><i class="fa-solid fa-chevron-right text-orange-500"></i>`;
                        resultsDiv.appendChild(card);
                    });
                }
            } catch (e) {
                loader.classList.add('hidden');
                error.innerText = "ERREUR : " + e.message;
                error.classList.remove('hidden');
                console.error(e);
            }
        }

        function showSuccess(place) {
            document.getElementById('ui-search').classList.add('hidden');
            document.getElementById('ui-final').classList.remove('hidden');
            document.getElementById('final-name').innerText = place.title;
            document.getElementById('final-addr').innerText = place.address || "";
            window.finalURL = `https://search.google.com/local/writereview?placeid=${place.place_id}`;
        }

        function copy() {
            navigator.clipboard.writeText(window.finalURL).then(() => {
                const btn = document.getElementById('copy-btn');
                const txt = document.getElementById('copy-text');
                btn.classList.replace('bg-slate-900', 'bg-green-500');
                txt.innerText = "LIEN COPIÉ !";
                if(navigator.vibrate) navigator.vibrate(50);
                setTimeout(() => {
                    btn.classList.replace('bg-green-500', 'bg-slate-900');
                    txt.innerText = "COPIER LE LIEN";
                }, 2000);
            });
        }
    </script>
</body>
</html>
